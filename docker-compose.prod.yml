services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bba_bca_wallah
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - app_network

  app:
    image: ${APP_IMAGE:-ghcr.io/sourav12kumar/bba-bca-wallah-jut:latest}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bba_bca_wallah?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      UPLOAD_DIR: /app/uploads
      SITE_URL: ${SITE_URL}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_PATH_STYLE: ${STORAGE_S3_PATH_STYLE:-false}
      STORAGE_S3_KEY_PREFIX: ${STORAGE_S3_KEY_PREFIX:-resources}
      STORAGE_S3_PRESIGN_MINUTES: ${STORAGE_S3_PRESIGN_MINUTES:-15}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    expose:
      - "8080"
    volumes:
      - resource_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - app_network

  caddy:
    image: caddy:2.9-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - app_network

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: bba_bca_wallah
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOADS_DIR: /uploads
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_ON_START: ${BACKUP_ON_START:-true}
    volumes:
      - db_backups:/backups
      - resource_uploads:/uploads:ro
    restart: unless-stopped
    networks:
      - app_network

  remote-backup:
    profiles: ["remote-backup"]
    build:
      context: .
      dockerfile: Dockerfile.remote-backup
    depends_on:
      - backup
    environment:
      BACKUP_DIR: /backups
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-bba-bca-wallah}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      REMOTE_SYNC_INTERVAL_SECONDS: ${REMOTE_SYNC_INTERVAL_SECONDS:-3600}
      REMOTE_SYNC_ON_START: ${REMOTE_SYNC_ON_START:-true}
      REMOTE_RETENTION_DAYS: ${REMOTE_RETENTION_DAYS:-30}
    volumes:
      - db_backups:/backups
    restart: unless-stopped
    networks:
      - app_network

volumes:
  mysql_data:
  resource_uploads:
  db_backups:
  caddy_data:
  caddy_config:

networks:
  app_network:
    driver: bridge
