<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Resources | BBA/BCA Wallah</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div th:replace="~{fragments :: header}"></div>
<section class="section"><h1>Academic Resources</h1>
<form class="filters" method="get" action="/resources"><input name="q" placeholder="Search by title"><select name="course"><option value="">Course</option><option th:each="c : ${courses}" th:value="${c}" th:text="${c}"></option></select><select name="semester"><option value="">Semester</option><option th:each="s : ${#numbers.sequence(1,6)}" th:value="${s}" th:text="${'Semester ' + s}"></option></select><select name="type"><option value="">Resource Type</option><option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option></select><button class="btn primary" type="submit">Filter</button></form>
<div class="cards"><article class="card" th:each="r : ${resources}"><div class="badge-row"><span class="badge small featured-badge" th:if="${r.featured}">FEATURED</span><span class="badge small" th:text="${r.type}"></span></div><h3 th:text="${r.title}"></h3><p><strong th:text="${r.course}"></strong> • Semester <span th:text="${r.semester}"></span></p><p th:if="${r.subject != null}" th:text="${'Subject: ' + r.subject.name}"></p><p th:text="${r.description}"></p><p class="download-meta" th:text="${r.downloadCount + ' downloads'}"></p><a class="btn primary" th:if="${r.fileUrl != null and !r.fileUrl.isBlank()}" th:href="@{'/resource/' + ${r.id} + '/download'}">Download / Open</a></article></div>
</section><div th:replace="~{fragments :: footer}"></div></body></html>
