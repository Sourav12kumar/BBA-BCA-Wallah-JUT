<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="${subject.name + ' | BBA/BCA Wallah'}"></title><link rel="stylesheet" href="/css/style.css"></head>
<body><div th:replace="~{fragments :: header}"></div>
<section class="subject-hero"><div><span class="badge" th:text="${subject.course + ' • Semester ' + subject.semester}"></span><h1 th:text="${subject.name}"></h1><p th:if="${subject.code != null and !subject.code.isBlank()}" th:text="${'Subject Code: ' + subject.code}"></p><a class="text-link" th:href="@{/subjects(course=${subject.course},semester=${subject.semester})}">← Back to subjects</a></div></section>
<section class="section">
<div class="resource-section" th:each="entry : ${groupedResources}"><div class="section-heading-row"><div><span class="badge small" th:text="${entry.key}"></span><h2 th:switch="${entry.key.name()}"><span th:case="'SYLLABUS'">Syllabus</span><span th:case="'PYQ'">Previous Year Questions</span><span th:case="'SAMPLE_QUESTION'">Sample / Model Questions</span><span th:case="'NOTES'">Notes</span><span th:case="'EBOOK'">E-Books</span><span th:case="'IMPORTANT_QUESTION'">Important Questions</span><span th:case="*">Other Resources</span></h2></div><span class="resource-count" th:text="${entry.value.size() + ' item(s)'}"></span></div><div class="cards"><article class="card" th:each="r : ${entry.value}"><div class="badge-row"><span class="badge small featured-badge" th:if="${r.featured}">FEATURED</span></div><h3 th:text="${r.title}"></h3><p th:if="${r.sessionYear != null and !r.sessionYear.isBlank()}" th:text="${'Session/Year: ' + r.sessionYear}"></p><p th:text="${r.description}"></p><p class="download-meta" th:text="${r.downloadCount + ' downloads'}"></p><a class="btn primary" th:if="${r.fileUrl != null and !r.fileUrl.isBlank()}" th:href="@{'/resource/' + ${r.id} + '/download'}">Open / Download</a></article></div></div>
<div th:if="${#maps.isEmpty(groupedResources)}" class="empty-state"><h3>No resources available yet</h3><p>Resources for this subject will appear here when added by the administrator.</p></div>
</section><div th:replace="~{fragments :: footer}"></div></body></html>
