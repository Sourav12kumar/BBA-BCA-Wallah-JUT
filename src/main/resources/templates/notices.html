<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notices | BBA/BCA Wallah</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div th:replace="~{fragments :: header}"></div>
<section class="section"><h1>Notices & Updates</h1><div class="notice-list"><article class="notice" th:classappend="${n.pinned} ? ' pinned-notice' : ''" th:each="n : ${notices}"><div><div class="badge-row"><span class="badge small priority-badge" th:if="${n.pinned}">PINNED</span><span class="badge small" th:text="${n.category != null ? n.category : 'Notice'}"></span></div><h3 th:text="${n.title}"></h3><p th:text="${n.content}"></p><a class="text-link" th:if="${n.externalUrl != null and !n.externalUrl.isBlank()}" th:href="${n.externalUrl}" target="_blank">View details →</a></div><span th:text="${n.noticeDate}"></span></article></div></section>
<div th:replace="~{fragments :: footer}"></div></body></html>
