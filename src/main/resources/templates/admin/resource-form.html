<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Form</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<section class="section narrow">
    <a class="text-link" href="/admin">← Dashboard</a>
    <h1>Add / Edit Resource</h1>

    <div class="alert error" th:if="${uploadError}" th:text="${uploadError}"></div>

    <form class="admin-form" th:object="${resource}" method="post" action="/admin/resources" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}">

        <label>Title</label>
        <input th:field="*{title}" required>

        <label>Course</label>
        <select th:field="*{course}" required>
            <option th:each="c : ${courses}" th:value="${c}" th:text="${c}"></option>
        </select>

        <label>Semester</label>
        <select th:field="*{semester}" required>
            <option th:each="s : ${#numbers.sequence(1,6)}" th:value="${s}" th:text="${s}"></option>
        </select>

        <label>Subject</label>
        <select th:field="*{subject}" required>
            <option value="">Choose Subject</option>
            <option th:each="s : ${subjects}" th:value="${s.id}"
                    th:text="${s.course + ' • Sem ' + s.semester + ' • ' + s.name}"></option>
        </select>

        <label>Resource Type</label>
        <select th:field="*{type}" required>
            <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
        </select>

        <label>Session / Year</label>
        <input th:field="*{sessionYear}">

        <label>Upload File</label>
        <input type="file" name="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt">
        <small class="form-help">Allowed: PDF, Word, PowerPoint, Excel, TXT. Maximum size: 20 MB.</small>

        <div th:if="*{fileUrl != null and !fileUrl.isBlank()}" class="current-file">
            <strong>Current resource:</strong>
            <a class="text-link" th:href="*{fileUrl}" target="_blank">Open current file/link</a>
        </div>

        <label>Or External File URL</label>
        <input th:field="*{fileUrl}" placeholder="Google Drive / OneDrive / public PDF URL">
        <small class="form-help">If you upload a new file, it will take priority over this URL.</small>

        <label>Description</label>
        <textarea th:field="*{description}" rows="5"></textarea>

        <label class="check">
            <input type="checkbox" th:field="*{active}"> Active
        </label>

        <button class="btn primary" type="submit">Save Resource</button>
    </form>
</section>
</body>
</html>
