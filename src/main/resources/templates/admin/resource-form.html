<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Resource Form</title><link rel="stylesheet" href="/css/style.css"></head><body><section class="section narrow"><a class="text-link" href="/admin">← Dashboard</a><h1>Add / Edit Resource</h1><form class="admin-form" th:object="${resource}" method="post" action="/admin/resources"><input type="hidden" th:field="*{id}"><label>Title</label><input th:field="*{title}" required><label>Course</label><select th:field="*{course}" required><option th:each="c : ${courses}" th:value="${c}" th:text="${c}"></option></select><label>Semester</label><select th:field="*{semester}" required><option th:each="s : ${#numbers.sequence(1,6)}" th:value="${s}" th:text="${s}"></option></select><label>Subject</label><select th:field="*{subject}" required><option value="">Choose Subject</option><option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.course + ' • Sem ' + s.semester + ' • ' + s.name}"></option></select><label>Resource Type</label><select th:field="*{type}" required><option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option></select><label>Session / Year</label><input th:field="*{sessionYear}"><label>File URL</label><input th:field="*{fileUrl}" placeholder="Google Drive / CDN / PDF URL"><label>Description</label><textarea th:field="*{description}" rows="5"></textarea><label class="check"><input type="checkbox" th:field="*{active}"> Active</label><button class="btn primary" type="submit">Save Resource</button></form></section></body></html>
