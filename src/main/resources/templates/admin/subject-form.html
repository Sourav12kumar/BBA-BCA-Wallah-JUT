<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Subject Form</title><link rel="stylesheet" href="/css/style.css"></head><body><section class="section narrow"><a class="text-link" href="/admin">← Dashboard</a><h1>Add / Edit Subject</h1><form class="admin-form" th:object="${subject}" method="post" action="/admin/subjects"><input type="hidden" th:field="*{id}"><label>Subject Name</label><input th:field="*{name}" required><label>Subject Code</label><input th:field="*{code}"><label>Course</label><select th:field="*{course}" required><option th:each="c : ${courses}" th:value="${c}" th:text="${c}"></option></select><label>Semester</label><select th:field="*{semester}" required><option th:each="s : ${#numbers.sequence(1,6)}" th:value="${s}" th:text="${s}"></option></select><label class="check"><input type="checkbox" th:field="*{active}"> Active</label><button class="btn primary" type="submit">Save Subject</button></form></section></body></html>
