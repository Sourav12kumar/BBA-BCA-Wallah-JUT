<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notice Form</title><link rel="stylesheet" href="/css/style.css"></head><body><section class="section narrow"><a class="text-link" href="/admin">← Dashboard</a><h1>Add / Edit Notice</h1><form class="admin-form" th:object="${notice}" method="post" action="/admin/notices"><input type="hidden" th:field="*{id}"><label>Title</label><input th:field="*{title}" required><label>Category</label><input th:field="*{category}" placeholder="Exam / Placement / Internship / University"><label>Date</label><input type="date" th:field="*{noticeDate}"><label>External Link</label><input th:field="*{externalUrl}"><label>Content</label><textarea th:field="*{content}" rows="7"></textarea><label class="check"><input type="checkbox" th:field="*{pinned}"> Pin this notice</label><small class="form-help">Pinned notices stay at the top and are highlighted on the homepage.</small><label class="check"><input type="checkbox" th:field="*{active}"> Active</label><button class="btn primary" type="submit">Save Notice</button></form></section></body></html>
