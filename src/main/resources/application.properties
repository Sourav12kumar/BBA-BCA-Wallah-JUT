spring.application.name=BBA-BCA-Wallah-JUT
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bba_bca_wallah?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}
app.upload.dir=${UPLOAD_DIR:uploads}
app.site.url=${SITE_URL:http://localhost:8080}

# Primary resource storage: local or s3
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.s3.bucket=${STORAGE_S3_BUCKET:}
app.storage.s3.region=${STORAGE_S3_REGION:us-east-1}
app.storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}
app.storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:}
app.storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:}
app.storage.s3.path-style=${STORAGE_S3_PATH_STYLE:false}
app.storage.s3.key-prefix=${STORAGE_S3_KEY_PREFIX:resources}
app.storage.s3.presign-minutes=${STORAGE_S3_PRESIGN_MINUTES:15}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.port=${PORT:8080}
