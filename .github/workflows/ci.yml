name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  java-build:
    name: Java 21 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Build application JAR
        run: mvn -B -DskipTests package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: bba-bca-wallah-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Docker & Recovery Validation
    runs-on: ubuntu-latest
    needs: java-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate local Docker Compose configuration
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password
          SITE_URL: http://localhost:8080
        run: docker compose config

      - name: Validate production Docker Compose configuration
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password
          SITE_URL: http://localhost:8080
          APP_IMAGE: ghcr.io/sourav12kumar/bba-bca-wallah-jut:latest
          BACKUP_INTERVAL_SECONDS: 86400
          BACKUP_RETENTION_DAYS: 14
          BACKUP_ON_START: "true"
        run: docker compose -f docker-compose.prod.yml config

      - name: Build application image
        run: docker build --tag bba-bca-wallah-jut:ci .

      - name: Build backup image
        run: docker build -f Dockerfile.backup --tag bba-bca-wallah-backup:ci .

      - name: Shell syntax check for recovery scripts
        run: |
          sh -n scripts/backup-db.sh
          sh -n scripts/restore-db.sh
          sh -n scripts/backup-uploads.sh
          sh -n scripts/restore-uploads.sh
          sh -n scripts/full-backup.sh
          sh -n scripts/restore-full.sh
          sh -n scripts/backup-loop.sh
